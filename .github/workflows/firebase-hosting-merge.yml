name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # TODO: тимчасово деплоїмо в старий проєкт to-my-money через ліміт на
      # створення нових Firebase-проєктів. Коли зʼявиться сервісний акаунт
      # для storknest (secrets.FIREBASE_SERVICE_ACCOUNT_STORKNEST), повернути
      # firebaseServiceAccount і projectId назад на storknest.
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TO_MY_MONEY }}
          channelId: live
          projectId: to-my-money
